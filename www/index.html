<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>개발 허브</title>
  <style>
    :root {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --border:   #334155;
      --accent:   #3b82f6;
      --accent2:  #1d4ed8;
      --text:     #f8fafc;
      --muted:    #94a3b8;
      --green:    #22c55e;
      --red:      #ef4444;
      --amber:    #f59e0b;
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      overscroll-behavior: none;
      min-height: 100vh;
    }
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 10px) 16px 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    .header-title em { font-style: normal; color: var(--accent); }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--text);
      font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }

    .screen { display: none; padding: 16px; padding-bottom: calc(24px + var(--safe-bottom)); }
    .screen.active { display: block; }

    /* ── 설정 화면 ─────────────────────────── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin-bottom: 6px;
    }
    .field input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      color: var(--text); font-size: 15px;
    }
    .field .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .btn {
      display: block; width: 100%; padding: 13px;
      border-radius: 10px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
      touch-action: manipulation;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline {
      background: transparent; border: 1px solid var(--border); color: var(--text);
      margin-top: 8px;
    }
    .test-result {
      margin-top: 12px; padding: 10px 12px; border-radius: 8px;
      font-size: 13px; display: none;
    }
    .test-result.ok { display: block; background: rgba(34,197,94,.15); color: var(--green); }
    .test-result.fail { display: block; background: rgba(239,68,68,.15); color: var(--red); }

    /* ── 대시보드 ──────────────────────────── */
    .tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .tile-top { display: flex; align-items: center; gap: 10px; }
    .tile-icon { font-size: 24px; }
    .tile-name { font-size: 16px; font-weight: 700; flex: 1; }
    .pill {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
      background: rgba(148,163,184,.15); color: var(--muted);
    }
    .pill.up { background: rgba(34,197,94,.15); color: var(--green); }
    .pill.down { background: rgba(239,68,68,.15); color: var(--red); }
    .tile-summary { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
    .tile-actions { display: flex; gap: 8px; margin-top: 12px; }
    .tile-actions button {
      flex: 1; padding: 9px; border-radius: 8px; font-size: 13px; font-weight: 700;
      border: 1px solid var(--border); background: transparent; color: var(--text);
      cursor: pointer; touch-action: manipulation;
    }
    .tile-actions button.run { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tile-actions button:disabled { opacity: .5; }

    .banner {
      background: rgba(239,68,68,.15); color: var(--red);
      border-radius: 10px; padding: 10px 12px; font-size: 13px;
      margin-bottom: 12px; display: none;
    }
    .banner.show { display: block; }

    /* ── 상세 뷰 ───────────────────────────── */
    #detailScreen { display: none; flex-direction: column; height: 100dvh; padding: 0; }
    #detailScreen.active { display: flex; }
    .detail-header {
      display: flex; align-items: center; gap: 10px;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .detail-header h2 { font-size: 16px; }
    .detail-body {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    }
    .detail-body iframe {
      width: 100%; height: 100%; border: 1px solid var(--border);
      border-radius: 10px; background: #fff; display: block;
    }
  </style>
</head>
<body>

  <!-- ── 설정 화면 ─────────────────────────── -->
  <div id="settingsScreen" class="screen">
    <div class="header">
      <div class="header-title">개발 <em>허브</em> 설정</div>
    </div>
    <div style="padding:16px;">
      <div class="field">
        <label>PC Tailscale IP</label>
        <input id="inIp" type="text" placeholder="100.x.x.x" autocapitalize="off" autocorrect="off">
      </div>
      <div class="field">
        <label>포트</label>
        <input id="inPort" type="number" placeholder="8787" value="8787">
      </div>
      <div class="field">
        <label>API 토큰</label>
        <input id="inToken" type="password" placeholder="hub_api.py 실행 시 .env의 HUB_API_TOKEN" autocapitalize="off" autocorrect="off">
        <div class="hint">PC의 K:\claude\.env 파일에 있는 HUB_API_TOKEN 값을 그대로 붙여넣으세요.</div>
      </div>
      <button class="btn btn-outline" id="btnTest">연결 테스트</button>
      <div id="testResult" class="test-result"></div>
      <button class="btn btn-primary" id="btnSave" style="margin-top:16px;">저장</button>
    </div>
  </div>

  <!-- ── 홈 대시보드 ────────────────────────── -->
  <div id="homeScreen" class="screen">
    <div class="header">
      <div class="header-title">개발 <em>허브</em></div>
      <button class="icon-btn" id="btnSettings">⚙️</button>
    </div>
    <div style="padding:16px;">
      <div id="connBanner" class="banner">연결 실패 — Tailscale 연결과 PC의 hub_api.py 실행 상태를 확인하세요.</div>
      <div id="tiles"></div>
    </div>
  </div>

  <!-- ── 상세 화면 ─────────────────────────── -->
  <div id="detailScreen" class="screen">
    <div class="detail-header">
      <button class="icon-btn" id="btnBack">←</button>
      <h2 id="detailTitle">리포트</h2>
    </div>
    <div id="detailBody" class="detail-body">불러오는 중...</div>
  </div>

<script>
(function () {
  var JOB_TIMEOUT = { dart: 190000, news: 70000, paper: 310000 };
  var JOB_LABEL_RUNNING = { dart: "수집 중...", news: "수집 중...", paper: "브리핑 실행 중..." };

  function cfg() {
    return {
      ip: localStorage.getItem("hub_ip") || "",
      port: localStorage.getItem("hub_port") || "8787",
      token: localStorage.getItem("hub_token") || "",
    };
  }
  function hasCfg() {
    var c = cfg();
    return !!(c.ip && c.token);
  }
  function apiUrl(path) {
    var c = cfg();
    return "http://" + c.ip + ":" + c.port + path;
  }
  function apiFetch(path, opts, timeoutMs) {
    opts = opts || {};
    var c = cfg();
    opts.headers = Object.assign({ "Authorization": "Bearer " + c.token, "Content-Type": "application/json" }, opts.headers || {});
    opts.cache = "no-store";
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs || 15000);
    opts.signal = controller.signal;
    return fetch(apiUrl(path), opts).finally(function () { clearTimeout(timer); });
  }

  function showScreen(id) {
    ["settingsScreen", "homeScreen", "detailScreen"].forEach(function (s) {
      document.getElementById(s).classList.toggle("active", s === id);
    });
  }

  // ── 설정 화면 ──────────────────────────────
  var inIp = document.getElementById("inIp");
  var inPort = document.getElementById("inPort");
  var inToken = document.getElementById("inToken");
  var testResult = document.getElementById("testResult");

  function loadSettingsForm() {
    var c = cfg();
    inIp.value = c.ip;
    inPort.value = c.port || "8787";
    inToken.value = c.token;
  }

  document.getElementById("btnTest").addEventListener("click", function () {
    localStorage.setItem("hub_ip", inIp.value.trim());
    localStorage.setItem("hub_port", inPort.value.trim() || "8787");
    localStorage.setItem("hub_token", inToken.value.trim());
    testResult.className = "test-result";
    testResult.textContent = "확인 중...";
    testResult.style.display = "block";
    apiFetch("/health", {}, 8000).then(function (r) {
      if (!r.ok) throw new Error("status " + r.status);
      return r.json();
    }).then(function () {
      testResult.className = "test-result ok";
      testResult.textContent = "✅ 연결 성공";
    }).catch(function (e) {
      testResult.className = "test-result fail";
      testResult.textContent = "❌ 연결 실패: " + e.message;
    });
  });

  document.getElementById("btnSave").addEventListener("click", function () {
    localStorage.setItem("hub_ip", inIp.value.trim());
    localStorage.setItem("hub_port", inPort.value.trim() || "8787");
    localStorage.setItem("hub_token", inToken.value.trim());
    if (!hasCfg()) {
      testResult.className = "test-result fail";
      testResult.textContent = "IP와 토큰을 입력하세요.";
      testResult.style.display = "block";
      return;
    }
    enterHome();
  });

  document.getElementById("btnSettings").addEventListener("click", function () {
    loadSettingsForm();
    testResult.style.display = "none";
    showScreen("settingsScreen");
  });

  // ── 홈 대시보드 ────────────────────────────
  var JOB_MATCH = [
    { test: function (name) { return name.indexOf("DART") !== -1; }, job: "dart" },
    { test: function (name) { return name.indexOf("뉴스") !== -1; }, job: "news" },
    { test: function (name) { return name.indexOf("논문") !== -1; }, job: "paper" },
  ];
  function jobFor(name) {
    for (var i = 0; i < JOB_MATCH.length; i++) {
      if (JOB_MATCH[i].test(name)) return JOB_MATCH[i].job;
    }
    return null;
  }

  var tilesEl = document.getElementById("tiles");
  var connBanner = document.getElementById("connBanner");

  function renderTiles(projects, statusData) {
    tilesEl.innerHTML = "";
    projects.forEach(function (p) {
      var job = jobFor(p.name);
      var tile = document.createElement("div");
      tile.className = "tile";

      var top = document.createElement("div");
      top.className = "tile-top";
      top.innerHTML = "<span class='tile-icon'>" + p.icon + "</span><span class='tile-name'>" + p.name + "</span>";

      if (!job) {
        var up = statusData && statusData.ai_procurement && statusData.ai_procurement.up;
        var pill = document.createElement("span");
        pill.className = "pill " + (up ? "up" : "down");
        pill.textContent = up ? "실행 중" : "꺼짐";
        top.appendChild(pill);
      }
      tile.appendChild(top);

      var summary = document.createElement("div");
      summary.className = "tile-summary";
      tile.appendChild(summary);

      if (job) {
        var actions = document.createElement("div");
        actions.className = "tile-actions";

        var runBtn = document.createElement("button");
        runBtn.className = "run";
        runBtn.textContent = "실행";
        runBtn.addEventListener("click", function () { runJob(job, runBtn, summary); });

        var viewBtn = document.createElement("button");
        viewBtn.textContent = "결과 보기";
        viewBtn.addEventListener("click", function () { openDetail(job, p.name); });

        actions.appendChild(runBtn);
        actions.appendChild(viewBtn);
        tile.appendChild(actions);
      } else {
        var hint = document.createElement("div");
        hint.className = "tile-summary";
        hint.textContent = "실행 기능은 추후 지원 (상태만 표시)";
        tile.appendChild(hint);
      }

      tilesEl.appendChild(tile);
    });
  }

  function runJob(job, btn, summaryEl) {
    btn.disabled = true;
    var origText = btn.textContent;
    btn.textContent = JOB_LABEL_RUNNING[job] || "실행 중...";
    summaryEl.textContent = "";
    apiFetch("/run/" + job, { method: "POST", body: "{}" }, JOB_TIMEOUT[job]).then(function (r) {
      return r.json().then(function (data) { return { status: r.status, data: data }; });
    }).then(function (res) {
      if (!res.data.ok) {
        summaryEl.textContent = "❌ 실패: " + (res.data.error || res.status);
        return;
      }
      summaryEl.textContent = summaryFor(job, res.data.data);
    }).catch(function (e) {
      summaryEl.textContent = "❌ 오류: " + e.message;
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = origText;
    });
  }

  function summaryFor(job, data) {
    if (job === "dart") return "총 " + data.total + " 수집 완료";
    if (job === "news") return "총 " + data.total + " 수집 완료";
    if (job === "paper") return "총 " + data.count + "편 분석 완료";
    return "완료";
  }

  function loadHome() {
    connBanner.classList.remove("show");
    Promise.all([
      apiFetch("/projects", {}, 10000).then(function (r) { return r.json(); }),
      apiFetch("/status", {}, 10000).then(function (r) { return r.json(); }),
    ]).then(function (results) {
      renderTiles(results[0].data, results[1].data);
    }).catch(function () {
      connBanner.classList.add("show");
    });
  }

  function enterHome() {
    showScreen("homeScreen");
    loadHome();
  }

  // ── 상세 화면 ─────────────────────────────
  var detailTitle = document.getElementById("detailTitle");
  var detailBody = document.getElementById("detailBody");

  document.getElementById("btnBack").addEventListener("click", function () {
    showScreen("homeScreen");
  });

  function openDetail(job, name) {
    detailTitle.textContent = name;
    detailBody.textContent = "불러오는 중...";
    showScreen("detailScreen");
    apiFetch("/report/" + job, {}, 15000).then(function (r) { return r.json(); }).then(function (res) {
      if (!res.ok) {
        detailBody.textContent = "리포트 없음";
        return;
      }
      var d = res.data;
      if (job === "dart") {
        detailBody.textContent = d.content;
      } else if (job === "news" && d.html) {
        detailBody.innerHTML = "";
        var iframe = document.createElement("iframe");
        detailBody.appendChild(iframe);
        iframe.srcdoc = d.html;
      } else if (job === "paper") {
        if (d.html) {
          detailBody.innerHTML = "";
          var iframe2 = document.createElement("iframe");
          detailBody.appendChild(iframe2);
          iframe2.srcdoc = d.html;
        } else {
          detailBody.textContent = (d.top || []).map(function (p) { return "• " + p.title; }).join("\n");
        }
      }
    }).catch(function (e) {
      detailBody.textContent = "불러오기 실패: " + e.message;
    });
  }

  // ── 시작 ──────────────────────────────────
  if (hasCfg()) {
    enterHome();
  } else {
    loadSettingsForm();
    showScreen("settingsScreen");
  }
})();
</script>
</body>
</html>
